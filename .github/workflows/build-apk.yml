name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Get dependencies
        run: cd waffle_express_admin && flutter pub get

      - name: Build APK
        run: |
          cd waffle_express_admin
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

          # Check where the APK actually is
          echo "=== Searching for APK ==="
          find . -name "*.apk" -type f
          echo "=== Checking expected location ==="
          ls -la build/app/outputs/flutter-apk/ || echo "Path not found"
        env:
          GRADLE_OPTS: "-Dorg.gradle.file.watch=false -Dorg.gradle.vfs.watch=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waffle-admin-apk
          path: waffle_express_admin/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
