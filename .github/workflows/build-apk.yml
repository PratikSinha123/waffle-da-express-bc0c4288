name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Get dependencies
        run: cd waffle_express_admin && flutter pub get

      - name: Build APK
        run: cd waffle_express_admin && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: waffle-admin-apk
          path: waffle_express_admin/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
